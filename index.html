<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zika Games 7 - Jogos Mobile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {

        }

        header {
            text-align: center;
            padding: 25px 15px;
            background: #111a24;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            color: #9fb3c8;
        }

        .container {
            width: 94%;
            max-width: 1100px;
            margin: auto;
        }

        .titulo {
            margin: 30px 0 20px;
            font-size: 25px;
        }

        .jogos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .card {
            background: #16212c;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #263746;
        }

        .card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
            background: #202d39;
        }

        .conteudo {
            padding: 15px;
        }

        .conteudo h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .conteudo p {
            color: #aebdca;
            line-height: 1.4;
            font-size: 14px;
        }

        .botao {
            display: block;
            text-align: center;
            text-decoration: none;
            color: white;
            background: #1689d8;
            padding: 13px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
        }

            justify-content: center;
            color: #788896;
            text-align: center;
        }
