<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Games 7 - Jogos Mobile</title>

    <meta name="description" content="Novo Games 7 - Os melhores jogos para celular, novidades, dicas e jogos mobile.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080d13;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background: #111923;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 1px solid #263442;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            color: #9aaaba;
        }

        .container {
            width: 94%;
            max-width: 1100px;
            margin: auto;
        }

        .titulo {
            margin: 30px 0 20px;
            font-size: 25px;
        }

        .anuncio {
            width: 100%;
            min-height: 90px;
            margin: 20px 0;
            border: 1px dashed #526273;
            background: #101820;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #718191;
            text-align: center;
            border-radius: 10px;
        }

        .jogos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: #141e28;
            border: 1px solid #263543;
            border-radius: 14px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            background: #202c38;
        }

        .conteudo {
            padding: 17px;
        }

        .conteudo h2 {
            margin: 0 0 10px;
            font-size: 21px;
        }

        .conteudo p {
            margin: 0;
            color: #aebbc8;
            line-height: 1.5;
            font-size: 15px;
        }

        .botao {
            display: block;
            margin-top: 17px;
            padding: 13px;
            text-align: center;
            background: #168bd3;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }

        .botao:hover {
            opacity: 0.85;
        }

        footer {
            margin-top: 40px;
            padding: 30px 15px;
            text-align: center;
            background: #111923;
            color: #81909f;
        }

        @media (max-width: 650px) {
            .jogos {
                grid-template-columns: 1fr;
            }

            .card img {
                height: 230px;
            }

            header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 Novo Games 7</h1>
    <p>Os melhores jogos para celular</p>
</header>

<main class="container">

    <h2 class="titulo">🎮
